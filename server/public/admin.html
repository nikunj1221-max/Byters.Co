<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brew Corner Orders</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; background: #fff; color: #000; margin: 0; padding: 16px; max-width: 900px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ddd 4px, #ddd 5px); }
  button { font: inherit; background: #fff; color: #000; border: 1px solid #000; padding: 3px 8px; cursor: pointer; margin: 2px 2px 2px 0; }
  button:hover { background: #000; color: #fff; }
  .muted { color: #555; font-size: 13px; }
  #err { margin: 8px 0; }
</style>
</head>
<body>
<h1>Brew Corner orders</h1>
<div id="err"></div>

<table>
  <thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody id="orders"></tbody>
</table>

<h2>Menu availability</h2>
<table>
  <thead><tr><th>Item</th><th>Status</th><th></th></tr></thead>
  <tbody id="menu"></tbody>
</table>

<script>
const key = new URLSearchParams(location.search).get("key") || sessionStorage.getItem("adminKey") || prompt("Admin key");
sessionStorage.setItem("adminKey", key || "");
const H = { "x-admin-key": key, "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(url, opts) {
  const r = await fetch(url, { headers: H, ...opts });
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}

async function load() {
  try {
    const [orders, menu] = await Promise.all([api("/api/orders"), api("/api/menu")]);
    $("err").textContent = "";
    $("orders").innerHTML = orders.map((o) => `
      <tr>
        <td>${o.id}<div class="muted">${esc(o.created_at)}</div></td>
        <td>${esc(o.name || "-")}<div class="muted">${esc(o.phone)}</div></td>
        <td>${o.items.map((l) => `${l.qty}x ${esc(l.name)} (${esc(l.size)}, ${esc(l.temp)}, ${esc(l.milk)})`).join("<br>")}</td>
        <td>${o.total}</td>
        <td><b>${esc(o.status)}</b></td>
        <td>${["preparing", "ready", "completed", "cancelled"].map((s) => `<button onclick="setStatus(${o.id},'${s}')">${s}</button>`).join("")}</td>
      </tr>`).join("") || `<tr><td colspan="6">No orders yet</td></tr>`;
    $("menu").innerHTML = menu.map((m) => `
      <tr><td>${esc(m.name)}</td><td>${m.available ? "available" : "SOLD OUT"}</td>
      <td><button onclick="setAvail('${m.id}',${!m.available})">${m.available ? "mark sold out" : "mark available"}</button></td></tr>`).join("");
  } catch (e) {
    $("err").textContent = "Could not load (wrong admin key?): " + e.message;
  }
}

async function setStatus(id, status) { await api("/api/orders/" + id, { method: "PATCH", body: JSON.stringify({ status }) }); load(); }
async function setAvail(id, available) { await api("/api/menu/" + id + "/availability", { method: "POST", body: JSON.stringify({ available }) }); load(); }

load();
setInterval(load, 5000);
</script>
</body>
</html>
